<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<title>Offertio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #100e0c;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #F0EDE8;
  }
  .glow {
    position: absolute;
    width: 720px;
    height: 480px;
    background: radial-gradient(ellipse, rgba(200,121,61,0.22) 0%, transparent 70%);
    top: -120px;
    left: -80px;
  }
  .content {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 72px 80px;
    gap: 48px;
  }
  .wordmark {
    font-size: 34px;
    font-weight: 650;
    letter-spacing: -0.04em;
  }
  .wordmark em { font-style: italic; font-weight: 500; color: #E7B089; }
  h1 {
    margin-top: 28px;
    max-width: 680px;
    font-size: 54px;
    line-height: 1.08;
    letter-spacing: -0.035em;
    font-weight: 700;
  }
  .sub {
    margin-top: 22px;
    max-width: 640px;
    font-size: 24px;
    line-height: 1.4;
    color: #D2CBC3;
  }
  .card {
    width: 340px;
    flex-shrink: 0;
    background: #1C1916;
    border: 1px solid rgba(200,121,61,0.4);
    border-radius: 28px;
    padding: 36px 32px;
  }
  .kicker {
    color: #F0C7A4;
    font-size: 16px;
    font-weight: 700;
  }
  .price {
    margin-top: 12px;
    font-size: 64px;
    letter-spacing: -0.04em;
    font-weight: 750;
    line-height: 1;
  }
  .unit { margin-top: 8px; font-size: 22px; color: #F0C7A4; }
  .term { margin-top: 22px; font-size: 20px; line-height: 1.4; color: #D2CBC3; }
  .url {
    position: absolute;
    left: 80px;
    bottom: 36px;
    font-size: 18px;
    color: rgba(240,237,232,0.55);
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="content">
    <div>
      <div class="wordmark">offert<em>io</em></div>
      <h1>Offerten und QR-Rechnungen für Schweizer Kleinbetriebe</h1>
      <p class="sub">Gründerplatz einmalig CHF 249. Swiss QR-Bill für die Einzelfirma.</p>
    </div>
    <aside class="card">
      <div class="kicker">Gründerplatz</div>
      <div class="price">CHF 249</div>
      <div class="unit">einmalig</div>
      <p class="term">2 Jahre inklusive, danach Gründerpreis CHF 9 pro Monat für immer.</p>
    </aside>
  </div>
  <div class="url">getoffertio.ch</div>
</body>
</html>
