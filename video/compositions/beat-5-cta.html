<!DOCTYPE html>

<div data-composition-id="beat-5-cta" data-start="0" data-duration="8" data-width="1920" data-height="1080">
  <style>
    [data-composition-id="beat-5-cta"] {
      background: #09090B;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      font-family: 'DM Sans', -apple-system, sans-serif;
    }

    [data-composition-id="beat-5-cta"] .noise {
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 50;
    }

    [data-composition-id="beat-5-cta"] .glow-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(200,121,61,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
      opacity: 0;
    }

    [data-composition-id="beat-5-cta"] .scene-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 80px 160px;
      box-sizing: border-box;
      position: relative;
      z-index: 5;
      gap: 0;
    }

    [data-composition-id="beat-5-cta"] .pricing-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 40px 56px;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(200,121,61,0.15),
        0 24px 64px rgba(0,0,0,0.4),
        0 4px 16px rgba(0,0,0,0.2);
      opacity: 0;
      min-width: 380px;
    }

    [data-composition-id="beat-5-cta"] .plan-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #918A80;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    [data-composition-id="beat-5-cta"] .plan-price {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 600;
      font-size: 96px;
      color: #1A1916;
      line-height: 1.0;
      letter-spacing: -0.03em;
    }

    [data-composition-id="beat-5-cta"] .plan-price .currency {
      font-size: 48px;
      vertical-align: top;
      margin-top: 14px;
      display: inline-block;
      color: #5A5750;
    }

    [data-composition-id="beat-5-cta"] .plan-forever {
      font-size: 16px;
      color: #5A5750;
      margin-top: 4px;
    }

    [data-composition-id="beat-5-cta"] .plan-features {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    [data-composition-id="beat-5-cta"] .feature-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #5A5750;
    }

    [data-composition-id="beat-5-cta"] .feature-check {
      color: #1A7F42;
      font-weight: 700;
    }

    [data-composition-id="beat-5-cta"] .cta-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 18px 48px;
      background: #C8793D;
      color: white;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      margin-top: 28px;
      cursor: default;
      box-shadow: 0 4px 16px rgba(168, 98, 46, 0.3), 0 1px 4px rgba(168, 98, 46, 0.2);
      opacity: 0;
    }

    [data-composition-id="beat-5-cta"] .trust-badges {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      opacity: 0;
    }

    [data-composition-id="beat-5-cta"] .trust-badge {
      font-size: 13px;
      color: #918A80;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    [data-composition-id="beat-5-cta"] .trust-dot {
      width: 5px;
      height: 5px;
      background: rgba(200, 121, 61, 0.5);
      border-radius: 50%;
    }

    [data-composition-id="beat-5-cta"] .brand-close {
      position: absolute;
      top: 50%;
      left: 50%;
      font-family: 'Fraunces', Georgia, serif;
      font-style: italic;
      font-weight: 600;
      font-size: 120px;
      color: #C8793D;
      letter-spacing: -0.02em;
      opacity: 0;
      z-index: 20;
      white-space: nowrap;
    }

    [data-composition-id="beat-5-cta"] .brand-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 800px;
      height: 300px;
      background: radial-gradient(ellipse, rgba(200,121,61,0.25) 0%, transparent 70%);
      opacity: 0;
      z-index: 15;
      pointer-events: none;
    }
  </style>

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,400;1,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <div class="noise"></div>
  <div class="glow-bg"></div>

  <div class="scene-content">
    <div class="pricing-card" id="pricing-card">
      <div class="plan-label">Werkbank</div>
      <div class="plan-price">
        <span class="currency">CHF</span> 0
      </div>
      <div class="plan-forever">für immer</div>
      <div class="plan-features">
        <div class="feature-line"><span class="feature-check">✓</span> 5 Dokumente / Monat</div>
        <div class="feature-line"><span class="feature-check">✓</span> QR-Rechnung CH</div>
        <div class="feature-line"><span class="feature-check">✓</span> PDF-Versand</div>
        <div class="feature-line"><span class="feature-check">✓</span> Mobile & Desktop</div>
      </div>
    </div>
    <div class="cta-button" id="cta-btn">
      Kostenlos starten →
    </div>
    <div class="trust-badges">
      <div class="trust-badge">
        <div class="trust-dot"></div>
        Keine Kreditkarte
      </div>
      <div class="trust-badge">
        <div class="trust-dot"></div>
        DSG &amp; DSGVO
      </div>
    </div>
  </div>

  <div class="brand-glow"></div>
  <div class="brand-close">Offertio.</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    gsap.set(".pricing-card", { y: 40, scale: 0.96, opacity: 0 });
    gsap.set(".cta-button", { opacity: 0, scale: 0.9 });
    gsap.set(".trust-badges", { opacity: 0 });
    gsap.set(".brand-close", { xPercent: -50, yPercent: -50, y: 30, opacity: 0 });
    gsap.set(".brand-glow", { xPercent: -50, yPercent: -50, opacity: 0 });

    tl.to(".glow-bg", { opacity: 1, duration: 1.0, ease: "power2.out" }, 0);

    tl.to(".pricing-card", {
      y: 0, scale: 1, opacity: 1, duration: 0.75, ease: "expo.out"
    }, 0.1);

    tl.to("#cta-btn", {
      opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)"
    }, 1.1);

    // Button glow pulse (finite: 8s duration, 1s cycle → 3 repeats max)
    tl.to("#cta-btn", {
      boxShadow: "0 4px 24px rgba(168,98,46,0.55), 0 1px 4px rgba(168,98,46,0.3)",
      duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true
    }, 1.7);

    tl.to(".trust-badges", { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.5);

    // Pricing card fades, brand name rises
    tl.to([".pricing-card", "#cta-btn", ".trust-badges"], {
      y: -20, opacity: 0, duration: 0.4, ease: "power2.in"
    }, 3.2);

    tl.to(".brand-glow", { opacity: 1, duration: 0.6, ease: "power2.out" }, 3.5);
    tl.to(".brand-close", { xPercent: -50, yPercent: -50, y: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 3.6);

    // Final warm pulse
    tl.to(".brand-close", {
      xPercent: -50, yPercent: -50, scale: 1.02, duration: 0.4, ease: "power2.out", overwrite: "auto"
    }, 4.5);
    tl.to(".brand-close", {
      xPercent: -50, yPercent: -50, scale: 1.0, duration: 0.5, ease: "power2.inOut", overwrite: "auto"
    }, 4.95);

    tl.to(".brand-glow", { opacity: 0.4, duration: 1.5, ease: "power2.inOut" }, 4.2);

    window.__timelines["beat-5-cta"] = tl;
  </script>
</div>
</template>
